<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" role="img" aria-labelledby="title desc">
  <title id="title">Yves Roland NKOME — Business Developer</title>
  <desc id="desc">Monogramme YN bleu nuit et or avec flèche ascendante.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#b7791f"/>
      <stop offset=".48" stop-color="#d8a94a"/>
      <stop offset="1" stop-color="#f0d99b"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081024"/>
      <stop offset="1" stop-color="#14213d"/>
    </linearGradient>
  </defs>

  <g transform="translate(8 14)">
    <text x="0" y="118" font-family="Georgia, 'Times New Roman', serif" font-size="128" font-weight="700" fill="url(#navy)" letter-spacing="-18">YN</text>
    <path d="M28 122 C72 84, 105 67, 148 28" fill="none" stroke="url(#gold)" stroke-width="18" stroke-linecap="round"/>
    <path d="M145 18 L176 10 L166 41 Z" fill="url(#gold)"/>
    <rect x="184" y="20" width="3" height="118" rx="1.5" fill="#d8a94a"/>
  </g>

  <g transform="translate(226 30)">
    <text x="0" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" fill="#0b132b">
      Yves Roland <tspan fill="#c48a2d">NKOME</tspan>
    </text>
    <line x1="0" y1="90" x2="44" y2="90" stroke="#c48a2d" stroke-width="3"/>
    <text x="60" y="98" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="8" fill="#0b132b">BUSINESS DEVELOPER</text>
    <line x1="442" y1="90" x2="488" y2="90" stroke="#c48a2d" stroke-width="3"/>
  </g>
</svg>